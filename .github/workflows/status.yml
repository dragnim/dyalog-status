name: Status checks

on:
  schedule:
    # Backup only: cron-job.org triggers the main run every 10 minutes.
    # Hourly, off the top of the hour when GitHub is busiest.
    - cron: "17 * * * *"
  push:
    branches: [main]   # republish straight away when services or updates change
  workflow_dispatch:   # "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false   # let a running publish finish; the next run waits

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore uptime history
        uses: actions/cache@v6
        with:
          path: history.json
          key: history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: history-

      - name: Check services and build page
        run: python3 build.py

      - name: Keep schedule alive
        continue-on-error: true   # never let this stop the page publishing
        # GitHub pauses scheduled workflows after 60 days with no repo activity.
        # Push an empty commit if the last one is more than 50 days old.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "status-bot"
            git config user.email "status-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled checks active"
            git push
          fi

      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Pages names each deployment after the commit, and every scheduled run uses the same commit.
      # Since GitHub's November 2026 Pages incident, repeat deployments of one commit report success
      # without updating the site, and actions/deploy-pages always uses the commit as the ID.
      # So this step deploys through the Pages API directly, with a unique ID for every run.
      - name: Unique deployment ID
        id: version
        run: echo "id=$(echo -n "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          BUILD_VERSION: ${{ steps.version.outputs.id }}
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: process.env.BUILD_VERSION,
              oidc_token: await core.getIDToken(),
            });
            const id = data.id || data.status_url.split('/').pop();
            core.info(`Created deployment ${id}`);
            core.setOutput('page_url', data.page_url);
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            for (let i = 0; i < 36; i++) {   // check every 5 seconds for up to 3 minutes
              await new Promise(r => setTimeout(r, 5000));
              const { data: d } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { ...repo, id });
              if (d.status === 'succeed') { core.info('Deployed'); return; }
              if (failed.includes(d.status)) { core.setFailed(`Pages deployment ended with ${d.status}`); return; }
              core.info(`Status: ${d.status}`);
            }
            // Cancel so a stuck deployment doesn't block the next run
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { ...repo, id }).catch(() => {});
            core.setFailed('Timed out waiting for the Pages deployment');
