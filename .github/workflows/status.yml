name: Status checks

on:
  schedule:
    # Every 10 minutes. On a private repo with the free plan, change to */30
    # to stay inside the monthly Actions allowance.
    - cron: "*/10 * * * *"
  push:
    branches: [main]   # republish straight away when services or updates change
  workflow_dispatch:   # "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check services and build page
        run: python3 build.py

      - name: Keep schedule alive
        # GitHub pauses scheduled workflows after 60 days with no repo activity.
        # Push an empty commit if the last one is more than 50 days old.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "status-bot"
            git config user.email "status-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled checks active"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
